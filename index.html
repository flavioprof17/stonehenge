<style>
/* Layout: scena 3D a tutto schermo; sopra, un cartiglio (titolo), un pannello-guida a destra e una barra delle tappe in basso. */
:root {
  --ground: #f1ece1;      /* gesso */
  --panel: rgba(241, 236, 225, 0.93);
  --ink: #23201a;         /* carbone */
  --muted: #6a6253;
  --line: rgba(35, 32, 26, 0.16);
  --ochre: #9a5b17;       /* ocra */
  --ochre-soft: rgba(154, 91, 23, 0.12);
  --lichen: #5f6f31;      /* lichene */
  --chip: rgba(241, 236, 225, 0.9);
  --shadow: 0 10px 30px rgba(20, 16, 10, 0.25);
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1b1915; --panel: rgba(27, 25, 21, 0.92); --ink: #ece5d6; --muted: #a9a08d; --line: rgba(236, 229, 214, 0.16);
    --ochre: #e2a95a; --ochre-soft: rgba(226, 169, 90, 0.14); --lichen: #a7b56d; --chip: rgba(27, 25, 21, 0.88); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1b1915; --panel: rgba(27, 25, 21, 0.92); --ink: #ece5d6; --muted: #a9a08d; --line: rgba(236, 229, 214, 0.16);
  --ochre: #e2a95a; --ochre-soft: rgba(226, 169, 90, 0.14); --lichen: #a7b56d; --chip: rgba(27, 25, 21, 0.88); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 16px; overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; background: #c9d6e2; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

.card { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 6px; }

#title { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 12px 16px 12px; max-width: min(340px, calc(100% - 32px)); }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#title h1 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 1.75rem; line-height: 1.05; text-wrap: balance; }
#title h1 em { font-style: italic; font-weight: 500; color: var(--ochre); }

#info { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: 380px; max-height: calc(100% - 200px); overflow: auto; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
#info header { display: flex; align-items: baseline; gap: 10px; }
#info .num { font-family: var(--f-display); font-size: 2.2rem; line-height: 0.9; color: var(--ochre); font-variant-numeric: tabular-nums; }
#info h2 { margin: 0; font-family: var(--f-display); font-size: 1.45rem; line-height: 1.1; text-wrap: balance; flex: 1; }
#collapse { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 0.85rem; color: var(--muted); }
#info .lead { margin: 0; font-size: 1.04rem; line-height: 1.45; }
#phase { border-left: 3px solid var(--lichen); background: var(--ochre-soft); padding: 8px 10px; font-size: 0.95rem; line-height: 1.35; border-radius: 0 4px 4px 0; }
#phase b { display: block; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lichen); font-weight: 700; margin-bottom: 2px; }
#info ol, #info ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; line-height: 1.4; font-size: 0.97rem; }
#info ol li::marker { font-family: var(--f-display); font-weight: 700; color: var(--ochre); }
#info ul li::marker { color: var(--ochre); }
.fact { font-size: 0.95rem; line-height: 1.4; padding-top: 10px; border-top: 1px dashed var(--line); }
.fact b { font-family: var(--f-display); font-style: italic; font-weight: 500; color: var(--ochre); font-size: 1.05rem; }
.nums { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-size: 0.92rem; margin: 0; }
.nums dt { color: var(--muted); }
.nums dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
#info.collapsed > :not(header) { display: none; }

#dock { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#dock > * { pointer-events: auto; }
#stops { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding: 6px; scrollbar-width: thin; }
.stop { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 13px 6px 7px; cursor: pointer; white-space: nowrap; font-size: 0.93rem; }
.stop .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ochre-soft); color: var(--ochre); font-family: var(--f-display); font-weight: 700; font-size: 0.9rem; }
.stop[aria-current="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.stop[aria-current="true"] .n { background: var(--ochre); color: var(--ground); }
#tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: center; padding: 6px 10px; font-size: 0.9rem; }
.tog { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.tog[aria-pressed="true"] { background: var(--lichen); color: var(--ground); border-color: var(--lichen); }
.sunbox { display: flex; align-items: center; gap: 8px; }
.sunbox label { color: var(--muted); }
#sun { width: 150px; accent-color: var(--ochre); }
#sunLabel { min-width: 92px; font-variant-numeric: tabular-nums; }
#speed { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 4px 6px; }

#walkhelp { position: fixed; left: 16px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; font-size: 0.88rem; line-height: 1.4; max-width: 260px; }
#pad { display: none; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; margin-top: 8px; }
#pad button { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; font-size: 1.1rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.touchtxt { display: none; }
@media (pointer: coarse) { #pad { display: grid; } .keys { display: none; } .touchtxt { display: inline; } }

#loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 5; text-align: center; padding: 0 16px; }
#loader p { font-family: var(--f-display); font-size: 1.3rem; margin: 0; }
#loader small { color: var(--muted); }

@media (max-width: 760px) {
  #title { padding: 8px 12px; }
  #title h1 { font-size: 1.3rem; }
  #info { left: 16px; right: 16px; width: auto; top: auto; bottom: calc(var(--dock-h, 150px) + 22px + env(safe-area-inset-bottom, 0px)); max-height: 42%; padding: 12px 14px 14px; gap: 10px; }
  #info .num { font-size: 1.7rem; }
  #info h2 { font-size: 1.2rem; }
  #sun { width: 110px; }
  #walkhelp { bottom: auto; top: calc(86px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
/* =====================================================================
   STONEHENGE 2500 a.C. — ambiente 3D didattico
   Parte 1: utilità, rumore, renderer, cielo, terreno
   ===================================================================== */
function buildStonehenge(THREE, OrbitControls, canvas, opts) {
  opts = opts || {};
  const D2R = Math.PI / 180;
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const isMobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent) || Math.min(window.innerWidth, window.innerHeight) < 600;

  // ---------- PRNG e rumore ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(2500);
  const rr = (a, b) => a + (b - a) * rand();
  function hash3(x, y, z) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1274126177)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const sm = t => t * t * (3 - 2 * t);
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = sm(x - xi), yf = sm(y - yi), zf = sm(z - zi);
    const L = (a, b, t) => a + (b - a) * t;
    const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi), c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
    const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1), c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
    return L(L(L(c000, c100, xf), L(c010, c110, xf), yf), L(L(c001, c101, xf), L(c011, c111, xf), yf), zf) * 2 - 1;
  }
  function fbm3(x, y, z, oct) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < (oct || 4); i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
    return s;
  }
  const fbm2 = (x, z, o) => fbm3(x, 7.31, z, o);
  const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIO = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const bump = (r, c, w) => (Math.abs(r - c) < w ? 0.5 + 0.5 * Math.cos(Math.PI * (r - c) / w) : 0);
  function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

  // ---------- geometria del monumento ----------
  // Mondo: +X = est, -Z = nord. Angolo phi nel piano XZ: (cos phi, sin phi).
  const AXIS_AZ = 50 * D2R;                       // azimut dell'alba al solstizio d'estate (circa 50° da nord)
  const AX = Math.sin(AXIS_AZ), AZ = -Math.cos(AXIS_AZ);
  const AXIS_PHI = Math.atan2(AZ, AX);            // ~ -40°
  const PX = -AZ, PZ = AX;                        // direzione laterale (perpendicolare all'asse)
  const R_SARSEN = 16.4;
  const polar = (r, phi) => V3(r * Math.cos(phi), 0, r * Math.sin(phi));
  const yawFor = phi => Math.PI / 2 - phi;        // +Z locale verso l'esterno, radiale

  // Buca del piedritto (stazione 3) scavata nel terreno
  const RAISE_PHI = AXIS_PHI + 12.5 * 12 * D2R;
  const raiseFrame = { o: polar(R_SARSEN, RAISE_PHI), yaw: yawFor(RAISE_PHI) };
  function toLocal(frame, x, z) {
    const dx = x - frame.o.x, dz = z - frame.o.z, c = Math.cos(frame.yaw), s = Math.sin(frame.yaw);
    return [dx * c - dz * s, dx * s + dz * c];
  }

  function heightAt(x, z) {
    const r = Math.hypot(x, z);
    let h = fbm2(x * 0.0035, z * 0.0035, 4) * 9 + fbm2(x * 0.02, z * 0.02, 3) * 0.7;
    const flat = smoothstep(55, 160, r);
    h = h * flat + fbm2(x * 0.06, z * 0.06, 2) * 0.12 * (1 - flat);
    // fossato e terrapieno (henge), con ingresso a nord-est
    const ang = Math.atan2(z, x);
    const gap = smoothstep(0.09, 0.15, Math.abs(angDiff(ang, AXIS_PHI)));
    const seg = 0.75 + 0.25 * noise3(ang * 9, 0, 3.3); // fossato irregolare, scavato a segmenti
    h += gap * (1.1 * bump(r, 48.6, 2.8) - 1.7 * seg * bump(r, 54.6, 2.5) + 0.35 * bump(r, 59, 1.6));
    // l'Avenue: due argini paralleli verso nord-est
    const s = x * AX + z * AZ, l = x * PX + z * PZ;
    const av = smoothstep(54, 62, s) * (1 - smoothstep(700, 760, s));
    if (av > 0) {
      const al = Math.abs(l);
      // appiana il fondo dell'Avenue (dove passa la slitta)
      h = lerp(h, h * 0.35, av * (1 - smoothstep(12, 22, al)));
      h += av * (0.55 * bump(al, 11, 1.6) - 0.6 * bump(al, 13.4, 1.2));
    }
    // buca del piedritto in costruzione
    const [lx, lz] = toLocal(raiseFrame, x, z);
    if (Math.abs(lx) < 2.0 && lz > -1.2 && lz < 4.2) {
      const wx = 1 - smoothstep(1.35, 1.9, Math.abs(lx));
      let d = 0;
      if (lz < -0.75) d = smoothstep(-1.15, -0.75, lz);      // parete verticale (foderata di pali)
      else if (lz < 0.5) d = 1;                              // fondo
      else d = 1 - smoothstep(0.5, 3.9, lz);                 // scivolo
      h = lerp(h, -1.6, clamp(d, 0, 1) * wx);
    }
    return h;
  }

  // ---------- renderer ----------
  let VW = opts.width || canvas.clientWidth || window.innerWidth;
  let VH = opts.height || canvas.clientHeight || window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
  renderer.setSize(VW, VH, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, VW / VH, 0.1, 4000);
  camera.position.set(70, 38, 70);

  // ---------- texture procedurali ----------
  function canvasTex(size, draw, repeat) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); draw(g, size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    if (repeat) t.repeat.set(repeat, repeat);
    return t;
  }
  function speckle(g, n, s, alpha, cols, rmin, rmax) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = cols[(rand() * cols.length) | 0];
      g.globalAlpha = alpha * rand();
      const r = rr(rmin, rmax);
      g.beginPath(); g.arc(rand() * s, rand() * s, r, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
  const grassTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#d9dccb'; g.fillRect(0, 0, s, s);
    speckle(g, 9000, s, 0.55, ['#a8b08a', '#c9cfae', '#8f9a6c', '#eef0dd', '#b7a983'], 0.6, 2.2);
    g.strokeStyle = '#7f8a5a';
    for (let i = 0; i < 5000; i++) {
      g.globalAlpha = 0.25 * rand(); const x = rand() * s, y = rand() * s;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2, 2), y - rr(3, 8)); g.stroke();
    }
    g.globalAlpha = 1;
  });
  const stoneTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#d8d4cc'; g.fillRect(0, 0, s, s);
    speckle(g, 16000, s, 0.35, ['#b8b1a4', '#efece5', '#9d968a', '#c7bfae'], 0.4, 1.6);
    speckle(g, 900, s, 0.25, ['#8a8478', '#a39c8c'], 2, 9);
    speckle(g, 120, s, 0.12, ['#6f6a60'], 6, 18);
  });
  const woodTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#c9b494'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 160; i++) {
      g.strokeStyle = rand() < 0.5 ? '#8c7656' : '#e0cfb2'; g.globalAlpha = 0.35 * rand(); g.lineWidth = rr(0.5, 2.5);
      const y = rand() * s; g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= s; x += 16) g.lineTo(x, y + Math.sin(x * 0.05 + i) * 2);
      g.stroke();
    }
    g.globalAlpha = 1;
  });
  const soilTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#d6d0c2'; g.fillRect(0, 0, s, s);
    speckle(g, 5000, s, 0.5, ['#f3f0e8', '#a99f8c', '#c2b8a2', '#8d8370'], 0.5, 2.5);
  });

  // ---------- cielo ----------
  const skyUniforms = {
    sunDir: { value: V3(0, 1, 0) },
    topColor: { value: new THREE.Color(0x3d6fb0) },
    horizonColor: { value: new THREE.Color(0xc9d6e2) },
    sunColor: { value: new THREE.Color(0xfff1d0) },
  };
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(3000, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position.z = gl_Position.w; }',
      fragmentShader: `uniform vec3 sunDir; uniform vec3 topColor; uniform vec3 horizonColor; uniform vec3 sunColor; varying vec3 vDir;
        void main(){ float h = clamp(vDir.y, -0.2, 1.0);
          vec3 col = mix(horizonColor, topColor, pow(max(h,0.0), 0.55));
          col = mix(col, horizonColor*0.75, smoothstep(0.0,-0.2,h));
          float sd = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
          col += sunColor * (pow(sd, 900.0)*6.0 + pow(sd, 12.0)*0.28 + pow(sd,3.0)*0.08);
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
    })
  );

  function makeParticles(max, color, opacity, grow, buoy) {
    const pos = new Float32Array(max * 3), alpha = new Float32Array(max), size = new Float32Array(max);
    const vel = new Float32Array(max * 3), life = new Float32Array(max), maxLife = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('alpha', new THREE.BufferAttribute(alpha, 1));
    geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { color: { value: new THREE.Color(color) }, scale: { value: VH * 0.5 } },
      vertexShader: 'attribute float alpha; attribute float size; varying float vA; uniform float scale; void main(){ vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 color; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d) * vA; if (a < 0.01) discard; gl_FragColor = vec4(color, a); \n#include <colorspace_fragment>\n }',
    });
    const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
    let head = 0;
    return {
      mat,
      emit(at, n, spread, up) {
        for (let k = 0; k < n; k++) {
          const i = head; head = (head + 1) % max;
          pos[i * 3] = at.x + rr(-spread, spread) * 0.3; pos[i * 3 + 1] = at.y; pos[i * 3 + 2] = at.z + rr(-spread, spread) * 0.3;
          vel[i * 3] = rr(-spread, spread); vel[i * 3 + 1] = rr(0.2, 1) * up; vel[i * 3 + 2] = rr(-spread, spread);
          maxLife[i] = life[i] = rr(1.2, 2.6) * (grow > 1 ? 3 : 1); size[i] = rr(0.15, 0.3) * (grow > 1 ? 2.5 : 1);
        }
      },
      update(dt) {
        for (let i = 0; i < max; i++) {
          if (life[i] <= 0) { alpha[i] = 0; continue; }
          life[i] -= dt;
          pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
          vel[i * 3 + 1] += buoy * dt; vel[i * 3] *= 0.985; vel[i * 3 + 2] *= 0.985;
          vel[i * 3] += 0.25 * dt; // brezza da ovest
          const f = life[i] / maxLife[i];
          alpha[i] = opacity * Math.min(1, (1 - f) * 6) * f;
          size[i] += grow * dt * 0.3;
        }
        geo.attributes.position.needsUpdate = true; geo.attributes.alpha.needsUpdate = true; geo.attributes.size.needsUpdate = true;
      },
    };
  }

    setQuality(q) { autoDropped = true; applyQuality(q); }, get quality() { return quality; },

    walkInput(f, r) { walk.touch.f = f; walk.touch.r = r; },
    resize(w, h) { VW = w; VH = h; renderer.setSize(w, h, false); if (composer) composer.setSize(w, h); applyOffset(); dust.mat.uniforms.scale.value = h * 0.5; smoke.mat.uniforms.scale.value = h * 0.5; },
    get mode() { return mode; }, get sun() { return sunS; }, debug: { scene, terrain, camera, controls, renderer, PERF, step, jump(id) { const v = VIEWS[id](); current = id; fly = null; follow = null; camera.position.copy(v.pos); controls.target.copy(v.target); } },
